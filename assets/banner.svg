<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Hyeonjin Hwang - Backend Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017">
        <animate attributeName="stop-color" values="#0d1017;#101528;#0d1017" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#171a2b">
        <animate attributeName="stop-color" values="#171a2b;#1d2140;#171a2b" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#232744">
        <animate attributeName="stop-color" values="#232744;#2b2f55;#232744" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="60%" stop-color="#7aa2f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0"/>
      <stop offset="50%" stop-color="#9ecbff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.78" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7aa2f7" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#8ba0d8" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="6s" repeatCount="indefinite"/>
  </rect>

  <rect width="340" height="260" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="translate" from="-360 0" to="1240 0" dur="7s" repeatCount="indefinite"/>
  </rect>

  <g fill="#9ecbff">
    <circle cx="962" cy="64" r="1.9"><animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.1s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="1044" cy="118" r="1.5"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="4.3s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="892" cy="176" r="1.7"><animate attributeName="opacity" values="0.12;0.65;0.12" dur="3.7s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="1118" cy="72" r="1.4"><animate attributeName="opacity" values="0.1;0.5;0.1" dur="5.2s" begin="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="806" cy="98" r="1.3"><animate attributeName="opacity" values="0.08;0.45;0.08" dur="4.8s" begin="0.4s" repeatCount="indefinite"/></circle>
  </g>

  <g opacity="0.5">
    <path d="M0 208 H1200" stroke="#7aa2f7" stroke-opacity="0.10" stroke-width="1"/>
    <path d="M0 52 H1200" stroke="#7aa2f7" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#7aa2f7" fill-opacity="0.28">
    <text x="80" y="46">{ }</text>
    <text x="1120" y="228" text-anchor="end">SELECT * FROM experience;</text>
  </g>

  <rect x="80" y="96" width="52" height="3" rx="1.5" fill="url(#accent)">
    <animate attributeName="width" values="52;96;52" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="80" y="152"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="46" font-weight="700" fill="#c8d3f5" letter-spacing="0.5">Hyeonjin Hwang</text>

  <text x="82" y="186"
        font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="17" font-weight="500" fill="#7e8bb5" letter-spacing="2.4">BACKEND DEVELOPER</text>

  <rect x="318" y="171" width="9" height="18" fill="#7aa2f7">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
  </rect>
</svg>
